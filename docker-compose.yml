services:
  db:
    image: postgres:16-alpine
    container_name: teammind_postgres
    restart: always
    environment:
      POSTGRES_DB: teammind
      POSTGRES_USER: teammind_user
      POSTGRES_PASSWORD: teammind_password
    volumes:
      - postgres_data:/var/lib/postgresql/data
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U teammind_user -d teammind"]
      interval: 3s
      timeout: 3s
      retries: 5

  backend:
    build:
      context: ./backend
      dockerfile: ../docker/Dockerfile.backend
    container_name: teammind_backend
    restart: always
    environment:
      SECRET_KEY: django-production-secret-key-teammind
      DEBUG: "True"
      ALLOWED_HOSTS: localhost,127.0.0.1,backend
      DB_ENGINE: postgresql
      DB_NAME: teammind
      DB_USER: teammind_user
      DB_PASSWORD: teammind_password
      DB_HOST: db
      DB_PORT: 5432
    depends_on:
      db:
        condition: service_healthy
    ports:
      - "8000:8000"
    volumes:
      - ./backend:/app

  frontend:
    build:
      context: .
      dockerfile: docker/Dockerfile.frontend
    container_name: teammind_frontend
    restart: always
    ports:
      - "80:80"
    depends_on:
      - backend

volumes:
  postgres_data:
